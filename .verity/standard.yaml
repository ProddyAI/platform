# Verity — Project Standard
# Synthesized by /verity-setup for Proddy (ProddyAI/platform)
# See STANDARDS-SPEC.md section 2 for the full schema.

version: "1.0.0"
created_by: "verity-setup (george.bobby@deeptune.com)"

# Project metadata — from codebase analysis
knowledge_spec:
  project_name: "proddy"
  languages:
    - typescript
  frameworks:
    - "Next.js 14 (App Router)"
    - "React 18"
    - "Convex"
    - "Vercel AI SDK"
    - "Liveblocks"
    - "BlockNote"
    - "Stream"
    - "Composio"
    - "TailwindCSS"
    - "Radix/Shadcn UI"
  architecture: monolith
  build_system: bun
  test_framework: "bun:test"

# Quality assessment dimensions (always 4)
quality_dimensions:
  - id: comprehensibility
    description: "Code readable in one context load"
    signals:
      - metric: file_length
        threshold: 300
        unit: lines
        rationale: "AI context windows degrade on large files; repo avg is 230 lines"
      - metric: cyclomatic_complexity
        threshold: 15
        unit: per_function
        rationale: "Complexity-aware feedback improves AI Pass@1 by 35.71%"
      - metric: function_length
        threshold: 50
        unit: lines
        rationale: "Short functions are easier for agents to modify safely"
      - metric: naming_quality
        tool: ai
        rationale: "Descriptive names improve AI comprehension by ~2x"

  - id: modularity
    description: "Modify one concern without touching 3+ files"
    signals:
      - metric: single_responsibility
        tool: ai
        rationale: "AI performance drops sharply at 3+ files per change"
      - metric: shallow_abstractions
        tool: ai
        rationale: "LLMs struggle with deep inheritance hierarchies"

  - id: type_safety
    description: "Type system catches errors before runtime"
    signals:
      - metric: strict_types
        languages: [typescript]
        tool: eslint
        rules:
          - "@typescript-eslint/no-explicit-any"
          - "@typescript-eslint/no-unsafe-assignment"
          - "@typescript-eslint/no-unsafe-call"
          - "@typescript-eslint/no-unsafe-return"
        rationale: ">50% reduction in compilation errors with strict types; convex/ tsconfig runs strict:true and CI gates on `bun run type`"

  - id: test_adequacy
    description: "Tests define expected behavior for agents"
    signals:
      - metric: test_coverage
        threshold: 80
        unit: percent
        ai_threshold: 90
        rationale: "90% recommended for AI-generated code"
      - metric: test_quality
        tool: ai
        rationale: "Tests (bun:test under tests/, mirroring source) are the primary safety net for agents"

# Security patterns (CWE-mapped, always all 7)
security_patterns:
  - id: no-hardcoded-secrets
    description: "No secrets, API keys, passwords, or tokens in source code"
    severity: critical
    cwe: [CWE-798]
    enforced_by:
      - tool: Trivy
        config:
          scanners: [secret]
      - tool: Semgrep
        rules: [generic.secrets]

  - id: input-sanitization
    description: "All user input validated and sanitized before use"
    severity: critical
    cwe: [CWE-20, CWE-80, CWE-89, CWE-117]
    enforced_by:
      - tool: Semgrep
        rules:
          - typescript.lang.security.audit.unsafe-html
          - javascript.lang.security.audit.unsafe-html

  - id: parameterized-queries
    description: "Database queries use parameters, never string concatenation"
    severity: critical
    cwe: [CWE-89]
    enforced_by:
      - tool: Semgrep
        rules:
          - javascript.lang.security.audit.sqli
          - typescript.lang.security.audit.sqli
    notes: "Convex uses a typed query builder (ctx.db.query + indexes), not raw SQL — SQLi surface is minimal; primary risk is any raw SQL in imports/webhooks."

  - id: dependency-verification
    description: "No known-vulnerable dependencies"
    severity: high
    cwe: [CWE-1395]
    enforced_by:
      - tool: Trivy
        config:
          scanners: [vuln]
          severity: [HIGH, CRITICAL]

  - id: no-unsafe-deserialization
    description: "No unsafe deserialization of untrusted data"
    severity: high
    cwe: [CWE-502]
    enforced_by:
      - tool: Semgrep
        rules:
          - javascript.lang.security.audit

  - id: access-control-checks
    description: "Authorization verified on all sensitive operations"
    severity: high
    cwe: [CWE-639]
    enforced_by: []  # AI-only — requires business context

  - id: config-file-integrity
    description: "Configuration files not manipulable by untrusted input"
    severity: high
    cwe: [CWE-15]
    enforced_by: []  # AI-only

# Project-specific patterns
custom_patterns:
  - id: convex-args-validators
    description: "Every Convex query/mutation/action uses object-form syntax with an explicit `args` validator (v.*); no untyped or positional args."
    severity: high
    enforced_by: []  # AI-only
    rationale: "convex/ runs strict:true and generates the client API from these signatures; unvalidated args break codegen and accept unchecked client input."

  - id: convex-workspace-authz
    description: "Convex functions touching workspace-scoped data must resolve identity from ctx.auth (not a client-supplied userId arg) and verify workspace membership/ownership before reading or writing."
    severity: critical
    enforced_by: []  # AI-only
    rationale: "Multi-tenant workspace app; identity-from-arg impersonation and missing per-document ownership checks are the largest measured defect class in generated Convex backends."

  - id: server-only-secrets
    description: "Third-party secret keys (Composio, Stream, Liveblocks, Dodo, OpenAI, Resend, OneSignal) are used only server-side (Convex actions, src/app/api/**, or *-server.ts) — never in client components or NEXT_PUBLIC_ env."
    severity: critical
    cwe: [CWE-798]
    enforced_by: []  # AI-only + Trivy secret scan
    rationale: "The app brokers many third-party integrations; leaking a key into a client bundle exposes every workspace's data."

  - id: feature-scoped-modules
    description: "New frontend logic lives under src/features/<feature>/ (api/, components/, hooks/, store/, etc.), not in shared src/components/."
    severity: low
    enforced_by: []  # AI-only
    rationale: "CLAUDE.md mandates the feature-scoped shape; scattering logic into shared components erodes modularity."

  - id: safe-react-keys
    description: "Do not use array index as the React key for dynamic, reorderable, or filterable lists (DeepSource JS-0437)."
    severity: low
    enforced_by: []  # AI-only
    rationale: "Recent commits fixed real index-as-key reconciliation bugs; the pattern recurs in list-heavy UI (boards, messages, dashboards)."

# Process constraints
process_constraints:
  self_healing_limit: 2
  analysis_mode: balanced

  # Knowledge system
  compound_enabled: true
  memory_graph_enabled: true
  memory_graph_budget_tokens: 2000
  knowledge_injection_budget_tokens: 2000
  finding_autosuppress_threshold: 2

  # Intent alignment
  intent_fail_threshold: 4
  intent_warn_threshold: 7

  exclude_paths:
    - node_modules
    - dist
    - build
    - .git
    - vendor
    - __pycache__
    - .next
    - coverage
    - convex/_generated
    - public
    - certificates

# Tool configuration (balanced mode, TypeScript)
tool_configuration:
  eslint9:
    enabled: true
    config_file: null   # project uses Biome for lint/format; ESLint9 runs standalone with curated Codacy patterns
  semgrep:
    enabled: true
    rulesets: ["p/security-audit", "p/typescript"]
  trivy:
    enabled: true
    scanners: ["vuln", "secret", "config"]
