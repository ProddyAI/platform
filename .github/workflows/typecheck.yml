name: Typecheck

# Runs `bun run type` (tsc --noEmit) on every pull request and on pushes
# to main, so type errors block a merge before they reach production.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: bun run type
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next-env.d.ts is gitignored and normally generated by `next dev`/
      # `next build`. tsconfig references it for Next's ambient types, so
      # recreate it here to make CI match a local `bun run type`.
      - name: Ensure Next.js ambient types
        run: |
          if [ ! -f next-env.d.ts ]; then
            {
              echo '/// <reference types="next" />'
              echo '/// <reference types="next/image-types/global" />'
              echo ''
              echo '// NOTE: This file should not be edited'
              echo '// see https://nextjs.org/docs/app/building-your-application/configuring/typescript for more information.'
            } > next-env.d.ts
          fi

      - name: Type check
        run: bun run type
