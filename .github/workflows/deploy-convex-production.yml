name: Deploy Convex (Production)

# Automatically deploys the Convex backend to production whenever code
# lands on `main` — the CI equivalent of running `bunx convex deploy -y`
# after switching to main locally.
on:
  push:
    branches: [main]

# Never run two production deploys at once. A new push waits for the
# in-flight deploy to finish instead of racing it.
concurrency:
  group: convex-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Convex production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `convex deploy` targets production automatically when
      # CONVEX_DEPLOY_KEY is a production deploy key. `-y` skips the
      # interactive confirmation so it runs unattended in CI.
      - name: Deploy to Convex production
        run: bunx convex deploy -y
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
